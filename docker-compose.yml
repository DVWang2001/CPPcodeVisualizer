version: '3.8'
services:
  gdbgui:
    build:
      context: .
      dockerfile: Dockerfile.gdbgui
    ports:
      - "5000:5000"
    volumes:
      - ./gdbgui/server/uploads:/app/gdbgui/server/uploads
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      # AI 功能（explain_error / generate_lesson）的伺服器端金鑰：從宿主機環境變數帶入
      - NVIDIA_API_KEY=${NVIDIA_API_KEY:-}
      - LESSON_AI_API_KEY=${LESSON_AI_API_KEY:-}
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined
