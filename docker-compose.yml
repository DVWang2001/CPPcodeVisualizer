services:
  gdbgui:
    build:
      context: .
      dockerfile: Dockerfile.gdbgui
      # 正式映像：沒有編譯器。Dockerfile 裡的 `test` stage（多一個 g++）只給測試用。
      target: runtime
    ports:
      - "5000:5000"
    # tini 當 PID 1，負責把 SIGTERM 轉給伺服器。別拿掉：kernel 會丟掉送給 PID 1、
    # 而處理函式是 SIG_DFL 的訊號；cli.py 的 SIGTERM handler 清完 uploads 後會
    # 改回 SIG_DFL 再對自己重送一次，伺服器若是 PID 1，這次重送就被吃掉、行程不會
    # 結束，每次 `docker compose stop/down`／重新部署都要等滿 10 秒寬限期再被
    # SIGKILL（實測 10.56 秒、exit 137；有 init 時立刻結束）。
    init: true
    volumes:
      # 唯一的持久儲存：使用者資料庫與 Flask 的 SECRET_KEY。
      #
      # SECRET_KEY 必須活過重啟——它以前每次啟動重新產生，有了登入之後那代表
      # 每次部署都把所有人登出。而這個目錄裡同時有密碼雜湊，所以伺服器啟動時會
      # 把它收成 0700（db.ensure_data_dir）。刻意**不是** bind mount。
      #
      # volume 名稱、掛載路徑與內容在移除伺服器 GDB 時刻意一律不動：回滾到
      # 舊版映像不需要任何資料遷移。
      - gdbgui-data:/var/lib/gdbgui
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      # 名稱是沙箱時代留下的，但仍有作用：db.py 看到它等於 1 時，資料目錄或
      # SECRET_KEY 的權限收不緊就**拒絕啟動**（沒設只會印警告）。別刪。
      - GDBGUI_REQUIRE_ISOLATION=1
      # 必須是學生手機可直接連線的網址；localhost 只會指向學生自己的手機。
      - MOBILE_JOIN_BASE_URL=${MOBILE_JOIN_BASE_URL:?Set MOBILE_JOIN_BASE_URL to a phone-reachable URL such as http://192.168.1.20:5000}
      # AI 功能（explain_error / generate_lesson）的伺服器端金鑰：從宿主機環境變數帶入
      - NVIDIA_API_KEY=${NVIDIA_API_KEY:-}
      - LESSON_AI_API_KEY=${LESSON_AI_API_KEY:-}
    security_opt:
      # 容器內任何行程都不能透過 setuid/檔案 capability 取得更多權限。
      # seccomp 用 Docker 預設 profile（原本的自訂 profile 只是為了沙箱的
      # unshare 而放寬，沙箱移除後就沒有理由比預設更寬）。
      - no-new-privileges:true
    # 正式機實體記憶體 1.9G。上限設得比實體還大等於沒設——真正動手的會是主機的
    # OOM killer，它挑的是「最肥的行程」而不是「越界的容器」，很可能連 sshd 一起
    # 帶走。留約 700M 給主機與 docker daemon。
    mem_limit: 1200m
    # 不能超過主機實際核心數，否則 daemon 直接拒絕建立容器（"range of CPUs is from
    # 0.01 to 1.00"）。正式機目前是 1 core，所以這裡就是 1.0——這個值是實際硬體的
    # 描述，不是願望；換機器才改，別為了單一台機器加沒版控的 override 檔。
    cpus: 1.0

volumes:
  # 使用者資料庫 + SECRET_KEY。`docker compose down` 不會刪 named volume，
  # 所以重啟後大家還是登入著的（`down -v` 才會刪掉，那等於重置整個站）。
  gdbgui-data:
