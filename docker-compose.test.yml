services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.gdbgui
      # 正式映像 + g++：tests/test_dp_course_lessons.py 要編譯教案原始碼核對答案。
      # 伺服器本身不呼叫編譯器；除了 g++ 之外與正式映像（target: runtime）相同。
      target: test
    command: ["python", "-m", "gdbgui", "--host=0.0.0.0", "--port=5000", "--no-browser"]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:5000/')\""]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 10s
    environment:
      - MOBILE_JOIN_BASE_URL=http://app:5000
    security_opt:
      - no-new-privileges:true
    networks:
      - test-net

  e2e:
    build:
      context: ./e2e
      dockerfile: Dockerfile
    depends_on:
      app:
        condition: service_healthy
    environment:
      - PLAYWRIGHT_BASE_URL=http://app:5000
    volumes:
      # 測試碼掛進去而不是烤進 image：改一條測試就要重建 image 的話，
      # 除錯迭代會慢到讓人開始「憑印象」判斷，而不是每次都真的重跑。
      - ./e2e/tests:/e2e/tests
      # 教案 bundle：zz_bst_animation 在 module 載入時就讀它，找不到會讓整批
      # 測試在收集階段中止（不是那一支失敗而已）。spec 從 /e2e/tests 往上兩層
      # 找，容器裡就是 /examples。
      - ./examples:/examples:ro
      - ./e2e/test-results:/e2e/test-results
      - ./e2e/playwright-report:/e2e/playwright-report
    networks:
      - test-net

networks:
  test-net:
