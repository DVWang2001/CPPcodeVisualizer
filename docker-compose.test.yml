version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.gdbgui
    command: >
      bash -c "
        g++ -g /app/examples/cpp/e2e_containers.cpp -o /tmp/e2e_test &&
        echo 'b e2e_bp' > /tmp/gdb_init.txt &&
        python -m gdbgui --host=0.0.0.0 --port=5000 --no-browser
          --gdb-cmd='gdb -x /tmp/gdb_init.txt'
          /tmp/e2e_test
      "
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:5000/')\""]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 10s
    networks:
      - test-net

  e2e:
    build:
      context: ./e2e
      dockerfile: Dockerfile
    depends_on:
      app:
        condition: service_healthy
    networks:
      - test-net

networks:
  test-net:
