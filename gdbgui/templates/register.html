{% extends "_auth_base.html" %}
{% block title %}註冊 - gdbgui{% endblock %}
{% block body %}
  <h1>建立帳號</h1>
  <p class="lede">寫教案、逐行示範、分享給其他人。</p>

  {% if error %}<p class="error" data-testid="auth-error">{{ error }}</p>{% endif %}

  <form method="post" action="{{ url_for('auth.register') }}" data-testid="register-form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}" />

    <label for="username">使用者名稱</label>
    <input id="username" name="username" type="text" autocomplete="username"
           autocapitalize="none" spellcheck="false" required autofocus
           value="{{ username or '' }}" />
    <p class="hint" style="margin-top: 0.4rem; font-size: 0.78rem;">
      這也是你的個人檔案網址：<span class="ident">/u/你的名稱</span>
    </p>

    <label for="display_name">顯示名稱</label>
    <input id="display_name" name="display_name" type="text" autocomplete="nickname"
           required value="{{ display_name or '' }}" />

    <label for="password">密碼</label>
    <input id="password" name="password" type="password"
           autocomplete="new-password" required />
    <p class="hint" style="margin-top: 0.4rem; font-size: 0.78rem;">請使用垃圾密碼註冊，例如 <code>garbage1</code>。</p>

    <button id="submit" type="submit">建立帳號</button>
  </form>

  <p class="hint">已經有帳號了？<a href="{{ url_for('auth.login') }}">登入</a></p>
{% endblock %}
