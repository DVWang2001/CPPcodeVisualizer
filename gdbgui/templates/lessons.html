{% extends "_auth_base.html" %}
{% block title %}教案庫 - gdbgui{% endblock %}
{% block body %}
  {# Jinja 的 autoescape 是開著的。lesson["title"] 與 lesson["display_name"] 都是
     使用者輸入，一律靠它轉義；這一頁沒有任何 |safe，也沒有任何使用者字串被插進
     <script> 或 HTML 屬性裡——底下那段 JS 只讀 data-lesson-id（整數）。 #}
  <style>.card { --card-width: 38rem; }</style>

  <h1>教案庫</h1>
  <p class="lede">
    共 <span class="count" data-testid="lesson-library-total">{{ total }}</span> 篇教案，最近更新的在前。
  </p>

  {% if lessons %}
    <ul class="listing" data-testid="lesson-library-list">
      {% for lesson in lessons %}
        {% set mine = current_user_id is not none and lesson["user_id"] == current_user_id %}
        <li class="row" data-testid="lesson-library-item">
          {# 行號槽。琥珀色中斷點圓點＝這一篇是你的：沿用 app 的規則
             「顏色代表狀態，不代表類別」，掃過清單時自己的教案像檔案裡的
             中斷點一樣一眼可見，不需要另外一個文字徽章。 #}
          <span class="gutter" aria-hidden="true">
            {% if mine %}<span class="bp"></span>{% endif %}{{ loop.index0 + (page - 1) * per_page + 1 }}
          </span>
          <span class="row-main">
            <a class="row-title"
               href="{{ url_for('http_routes.gdbgui') }}?lesson={{ lesson['id'] }}"
               data-testid="lesson-library-title">{{ lesson["title"] }}</a>
            <span class="row-meta">
              <a href="{{ url_for('auth.profile', username=lesson['username']) }}"
                 data-testid="lesson-library-author">{{ lesson["display_name"] }}</a>
              <time datetime="{{ lesson['updated_at'] }}">{{ lesson["updated_at"] }}</time>
              {% if mine %}
                <button type="button"
                        class="lesson-delete"
                        data-lesson-id="{{ lesson['id'] }}"
                        data-testid="lesson-delete">刪除</button>
              {% endif %}
            </span>
          </span>
        </li>
      {% endfor %}
    </ul>
  {% else %}
    <p class="empty" data-testid="lesson-library-empty">
      還沒有任何教案。<a href="{{ url_for('http_routes.gdbgui') }}">開啟除錯器</a>寫第一篇。
    </p>
  {% endif %}

  <p class="pager">
    <span>
      {% if page > 1 %}
        <a href="{{ url_for('http_routes.lesson_library', page=page - 1) }}"
           data-testid="lesson-library-prev">← 上一頁</a>
      {% endif %}
    </span>
    <span data-testid="lesson-library-page">第 {{ page }} / {{ last_page }} 頁</span>
    <span>
      {% if page < last_page %}
        <a href="{{ url_for('http_routes.lesson_library', page=page + 1) }}"
           data-testid="lesson-library-next">下一頁 →</a>
      {% endif %}
    </span>
  </p>

  <p class="nav">
    <a href="{{ url_for('http_routes.gdbgui') }}">開啟除錯器</a>
  </p>

  {# csrf_token 是伺服器產生的 hex，經由 data- 屬性交給下面的腳本讀取。
     刻意不把它（或任何值）插進 JS 原始碼字串裡——那條路徑上一旦哪天換成
     使用者可控的值就是 XSS，用屬性讀取就不會有那個形狀。 #}
  <script data-csrf="{{ csrf_token }}">
    // 刪除走 DELETE /api/lessons/<id>：擁有權在伺服器端判斷（SQL 的
    // WHERE user_id = ?），這顆按鈕只是入口。非擁有者就算自己造一個請求
    // 送出去也只會拿到 404。
    (function () {
      var token = document.currentScript.getAttribute("data-csrf");
      document.querySelectorAll(".lesson-delete").forEach(function (button) {
        button.addEventListener("click", function () {
          var id = button.getAttribute("data-lesson-id");
          if (!window.confirm("刪除這篇教案？此操作無法復原。")) return;
          fetch("/api/lessons/" + encodeURIComponent(id), {
            method: "DELETE",
            headers: { "x-csrftoken": token },
            credentials: "same-origin"
          }).then(function (response) {
            if (response.ok) {
              window.location.reload();
            } else {
              window.alert("刪除失敗。");
            }
          });
        });
      });
    })();
  </script>
{% endblock %}
