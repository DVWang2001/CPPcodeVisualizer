{% extends "_auth_base.html" %}
{% block title %}登入 - gdbgui{% endblock %}
{% block body %}
  <h1>登入</h1>

  {% if error %}<p class="error" data-testid="auth-error">{{ error }}</p>{% endif %}

  <form method="post" action="{{ url_for('auth.login') }}" data-testid="login-form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}" />

    <label for="username">使用者名稱</label>
    <input id="username" name="username" type="text" autocomplete="username"
           autocapitalize="none" spellcheck="false" required autofocus />

    <label for="password">密碼</label>
    <input id="password" name="password" type="password"
           autocomplete="current-password" required />

    <button id="submit" type="submit">登入</button>
  </form>

  <p class="hint">還沒有帳號？<a href="{{ url_for('auth.register') }}">註冊一個</a></p>
{% endblock %}
